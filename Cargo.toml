[package]
name = "openprocyon-editor"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.97.1" # Bevy 0.20, same as the engine
publish = false

[lib]
name = "openprocyon_editor"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "procyon-editor"
path = "src/main.rs"

[dependencies]
# OpenProcyon#654 (duplicate-id false positives, lobby error text, console win/lose in any battle) and #651 (developer console
# in every singleplayer battle), on top of #646, #647, #649, #641, #638-#640, merged on main as f1bf09f; pinned to that
# commit until a release tag includes it.
openprocyon = { git = "https://github.com/DeraymaekerThibault/OpenProcyon", rev = "f1bf09f" }
# Same version and features as the engine's game/Cargo.toml at f1bf09f; keep them equal on every engine upgrade.
bevy = { version = "0.20", default-features = false, features = ["default_app", "3d_bevy_render", "ui_bevy_render", "scene", "std", "bevy_winit", "default_font", "multi_threaded", "x11", "wayland", "bevy_audio", "vorbis"] }
# bevy_egui defaults minus `picking` (map dragging uses egui's own drag sense; the engine does not build bevy_picking).
bevy_egui = { version = "0.43", default-features = false, features = ["manage_clipboard", "open_url", "default_fonts", "render", "bevy_ui"] }
rfd = "0.17"
serde_json = { version = "1", features = ["preserve_order"] } # same as the engine
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }

# Copied from the engine: dependencies optimised, our own code quick to rebuild.
# Debug info is the bulk of a debug build here (each test binary was ~2.4 GB with full info): line tables keep backtraces readable,
# and the dependencies carry none.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false
