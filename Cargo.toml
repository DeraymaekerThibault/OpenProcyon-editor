[package]
name = "openprocyon-editor"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.97.1" # Bevy 0.20, same as the engine
publish = false

[lib]
name = "openprocyon_editor"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "procyon-editor"
path = "src/main.rs"

[dependencies]
# TEMPORARY pin (T11): the engine branch claude/mission-templates at 1b7a129 (mission templates in `authoring`, on top of main 925d8e4, which has #631).
# Move this to the commit on engine main once that branch is merged, then to a release tag that includes it.
openprocyon = { git = "https://github.com/DeraymaekerThibault/OpenProcyon", rev = "1b7a129" }
# Same version and features as the engine's game/Cargo.toml at 1b7a129 (unchanged from 925d8e4); keep them equal on every engine upgrade.
bevy = { version = "0.20", default-features = false, features = ["default_app", "3d_bevy_render", "ui_bevy_render", "scene", "std", "bevy_winit", "default_font", "multi_threaded", "x11", "wayland", "bevy_audio", "vorbis"] }
# bevy_egui defaults minus `picking` (map dragging uses egui's own drag sense; the engine does not build bevy_picking).
bevy_egui = { version = "0.43", default-features = false, features = ["manage_clipboard", "open_url", "default_fonts", "render", "bevy_ui"] }
rfd = "0.17"
serde_json = { version = "1", features = ["preserve_order"] } # same as the engine
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }

# Copied from the engine: dependencies optimised, our own code quick to rebuild.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
