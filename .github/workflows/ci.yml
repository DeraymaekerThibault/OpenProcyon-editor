# The validation gate without game assets. Never upload build outputs or assets as artifacts.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1" # Mondays: build against the engine's main branch
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: 0
jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev libvulkan1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: tools/check.sh

  # Builds against the engine's main branch instead of the pinned tag, so breaking engine changes show up before the next release.
  engine-main:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev libvulkan1
      - uses: dtolnay/rust-toolchain@stable
      - name: Point the engine dependency at main (this job only)
        run: sed -i 's|tag = "v[0-9.]*"|branch = "main"|' Cargo.toml && grep -q 'branch = "main"' Cargo.toml && rm -f Cargo.lock
      - run: cargo build --all-targets && cargo test
